name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & test (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select latest Xcode (Swift 6 for tools-version 6.0)
        run: |
          latest=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          echo "Using $latest"
          sudo xcode-select -s "$latest/Contents/Developer"
      - name: Show toolchain
        run: swift --version
      - name: Build (SwiftPM)
        run: swift build
      - name: Test
        run: ./scripts/test.sh
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build app target
        run: |
          xcodebuild build \
            -project Koe.xcodeproj -scheme Koe \
            -destination 'generic/platform=macOS' -configuration Debug \
            CODE_SIGNING_ALLOWED=NO

  invariants:
    name: Invariant guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Invariant 4 (docs/plan/00-overview.md): all logging goes through the Log
      # wrapper so body text never reaches a log. Ban direct os_log/NSLog/print
      # in Sources, except inside the Log wrapper itself.
      - name: No direct logging outside the Log wrapper
        run: |
          hits=$(grep -rnE '\b(os_log|NSLog|print)\s*\(' Sources App \
                   --include='*.swift' | grep -v '/Log\.swift:' || true)
          if [ -n "$hits" ]; then
            echo "::error::direct logging found (use the Log wrapper):"
            echo "$hits"; exit 1
          fi
      # Invariant 5: API keys live only in the Keychain, never UserDefaults.
      - name: No API keys in UserDefaults
        run: |
          hits=$(grep -rniE 'UserDefaults.*(apikey|api_key|token|secret)' Sources App \
                   --include='*.swift' || true)
          if [ -n "$hits" ]; then
            echo "::error::possible API key written to UserDefaults:"
            echo "$hits"; exit 1
          fi
